    <title>LumosTime - 说出来，就能记下来</title>
    <style>
      :root{--paper:#faf9f6;--ink:#1c1917;--body:#57534e;--line:#e7e5e4;--lav:#8b6fa8;--lavsoft:#f2edf6;--green:#7a9176;--blue:#6b8ca8}*{box-sizing:border-box}body{min-width:960px;min-height:540px;margin:0;overflow:hidden;background:#dedad2;color:var(--ink);font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun','Microsoft YaHei',serif}button{font:inherit}.film{position:relative;width:100vw;height:100vh;min-width:960px;min-height:540px;overflow:hidden;isolation:isolate;background:linear-gradient(90deg,rgba(77,68,56,.028) 1px,transparent 1px),linear-gradient(rgba(77,68,56,.022) 1px,transparent 1px),var(--paper);background-size:42px 42px}.film:after{position:absolute;inset:0;z-index:30;content:'';opacity:.16;pointer-events:none;background-image:radial-gradient(rgba(64,54,43,.18) .5px,transparent .6px);background-size:5px 5px;mix-blend-mode:multiply}.meta,.scene{position:absolute;top:5.7%;z-index:10;color:#a8a29e;font-family:Georgia,'Times New Roman',serif;font-size:clamp(9px,.82vw,14px);letter-spacing:.12em}.meta{left:6.25%}.scene{right:6.25%;letter-spacing:.08em}.copy{position:absolute;top:27%;left:6.25%;z-index:6;width:28.5%}.copy h1{margin:0;font-size:clamp(36px,4vw,76px);font-weight:600;line-height:1.18;letter-spacing:0}.copy h1 span{display:block}.copy .muted{color:#a8a29e}.copy-rule{width:0;height:1px;margin-top:29px;background:#a8a29e}.copy p{margin:26px 0 0;color:var(--body);font-size:clamp(14px,1.2vw,21px);line-height:1.75;opacity:0;transform:translateY(12px)}
      .app{position:absolute;top:13%;right:6.25%;bottom:11.5%;z-index:4;width:59%;min-width:630px;overflow:hidden;border:1px solid rgba(87,83,78,.13);border-radius:8px;background:#fbfaf8;box-shadow:0 26px 55px rgba(64,53,42,.16),0 2px 8px rgba(64,53,42,.08);opacity:0;transform:translateX(9%) scale(.97)}.titlebar{display:flex;align-items:center;height:8%;min-height:37px;padding:0 20px;border-bottom:1px solid rgba(231,229,228,.95);background:rgba(255,255,255,.72);color:#a8a29e;font-family:ui-sans-serif,system-ui,sans-serif}.avatar{display:grid;width:31px;height:31px;place-items:center;border:1px solid #e3d9eb;border-radius:10px;background:#f6f1f8;color:var(--lav);font-size:15px}.assistant-name{margin-left:10px;color:#292524;font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;font-size:clamp(14px,1.05vw,18px);font-weight:700}.status{margin-left:9px;color:#a8a29e;font-size:10px;letter-spacing:.08em}.close{margin-left:auto;color:#a8a29e;font-size:22px}.chat{height:82%;padding:28px 7.5% 12px;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif}.message{display:flex;align-items:flex-start;gap:10px;margin-bottom:19px}.message.user{flex-direction:row-reverse}.face{display:grid;width:31px;height:31px;flex:0 0 31px;place-items:center;border:1px solid #e7e5e4;border-radius:10px;background:#fff;color:#78716c;font-size:13px}.message.user .face{border-color:#e3d9eb;background:#f8f3fa;color:var(--lav)}.bubble{max-width:75%;padding:12px 15px;border:1px solid #e7e5e4;border-radius:15px;background:#fff;color:#44403c;font-size:clamp(11px,.9vw,15px);line-height:1.65;box-shadow:0 0 0 1px rgba(0,0,0,.015);opacity:0;transform:translateY(11px)}.user .bubble{border-color:#e5d9ed;background:var(--lavsoft)}.assistant-copy{margin:1px 0 10px}.applied{padding-left:12px;border-left:2px solid #d7c5e2;opacity:0;transform:translateY(8px)}.applied-label{margin:0 0 8px;color:#a8a29e;font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;font-size:10px;letter-spacing:.08em}.log-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #e7e5e4;border-radius:8px;background:#fffdfb;color:#57534e;font-size:11px}.log-card+.log-card{margin-top:7px}.time{display:flex;width:79px;flex-direction:column;color:#78716c;font-family:ui-monospace,'Cascadia Mono',monospace;font-size:10px}.log-card strong{color:#292524;font-size:12px}.tag{margin-left:auto;color:var(--lav);font-size:10px;white-space:nowrap}.composer{display:flex;height:10%;align-items:center;gap:9px;padding:9px 19px;border-top:1px solid #e7e5e4;background:#fff}.input{flex:1;padding:9px 12px;border:1px solid #e7e5e4;border-radius:9px;color:#a8a29e;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px}.send{display:grid;width:31px;height:31px;place-items:center;border-radius:10px;background:var(--lav);color:white;font-size:15px}.final{position:absolute;bottom:13.4%;left:6.25%;z-index:7;max-width:350px;margin:0;color:var(--body);font-size:clamp(14px,1.2vw,21px);line-height:1.6;opacity:0;transform:translateY(10px)}.final strong{color:var(--ink);font-weight:600}.control{position:fixed;right:20px;bottom:20px;left:20px;z-index:40;display:flex;align-items:center;gap:12px;width:min(520px,calc(100vw - 40px));margin:auto;padding:10px 12px;border:1px solid rgba(70,59,48,.12);border-radius:7px;background:rgba(253,251,247,.91);box-shadow:0 10px 32px rgba(50,42,34,.16);backdrop-filter:blur(12px);font-family:ui-sans-serif,system-ui,sans-serif}.play{display:grid;width:29px;height:29px;flex:0 0 auto;place-items:center;border:0;border-radius:50%;color:white;background:var(--ink);cursor:pointer;font-size:12px}.control input{width:100%;accent-color:var(--ink)}output{width:72px;color:#57534e;font-size:11px;text-align:right}
      .copy h1 span:first-child{animation:up 10s .1s both}.copy h1 span:last-child{animation:up 10s .6s both}.copy-rule{animation:rule 10s both}.copy p{animation:body 10s both}.app{animation:app 10s both}.user .bubble{animation:bubble 10s .2s both}.assistant .bubble{animation:bubble 10s .55s both}.applied{animation:applied 10s both}.final{animation:final 10s both}@keyframes up{0%,8%{opacity:0;transform:translateY(16px)}17%,100%{opacity:1;transform:none}}@keyframes rule{0%,25%{width:0;opacity:0}34%,100%{width:78px;opacity:1}}@keyframes body{0%,28%{opacity:0;transform:translateY(12px)}37%,100%{opacity:1;transform:none}}@keyframes app{0%,22%{opacity:0;transform:translateX(9%) scale(.97)}38%,100%{opacity:1;transform:none}}@keyframes bubble{0%,51%{opacity:0;transform:translateY(11px)}64%,100%{opacity:1;transform:none}}@keyframes applied{0%,69%{opacity:0;transform:translateY(8px)}83%,100%{opacity:1;transform:none}}@keyframes final{0%,84%{opacity:0;transform:translateY(10px)}93%,100%{opacity:1;transform:none}}@media(max-width:1100px){.app{right:4.5%;width:61%}.copy{left:4.5%;width:27%}.meta{left:4.5%}.scene{right:4.5%}.final{left:4.5%}.chat{padding-left:5%;padding-right:5%}}
    </style>

  <body><main class="film" aria-label="LumosTime 横屏宣传片分镜：说出来，就能记下来"><div class="meta">LUMOSTIME / PRODUCT FILM</div><div class="scene">SCENE 05 · SPEAK NATURALLY</div><section class="copy"><h1><span>说出来，</span><span class="muted">就能记下来。</span></h1><div class="copy-rule"></div><p>不用先整理好格式。<br />自然语言会变成<strong>可追溯的时间记录。</strong></p></section><section class="app" aria-label="按当前 AIBackfillChatModal 和对话结果卡结构重建的 AI 补记页面"><header class="titlebar"><div class="avatar">✦</div><span class="assistant-name">时间助理</span><span class="status">上下文开启</span><span class="close">×</span></header><section class="chat"><div class="message user"><div class="face">我</div><div class="bubble">今天上午 9 点到 11 点写代码，然后开会一小时。</div></div><div class="message assistant"><div class="face">✦</div><div><div class="bubble"><p class="assistant-copy">已为你整理 2 条时间记录，并自动关联到「工作」领域。</p><div class="applied"><p class="applied-label">应用结果</p><div class="log-card"><span class="time">09:00<br>11:00</span><strong>写代码</strong><span class="tag"># 工作 / 开发</span></div><div class="log-card"><span class="time">11:00<br>12:00</span><strong>开会</strong><span class="tag">% 工作</span></div></div></div></div></div></section><footer class="composer"><div class="input">描述刚刚发生的事，或告诉我下一步计划</div><div class="send">↑</div></footer></section><p class="final">说得随意一点也没关系。<strong>系统会把它安放好。</strong></p><div class="control" aria-label="试片播放控制"><button class="play" id="playPause" type="button" aria-label="暂停试片">Ⅱ</button><input id="progress" type="range" min="0" max="10" step="0.01" value="0" aria-label="试片进度"><output id="timeLabel" for="progress">0.0 / 10.0</output></div></main><script>const b=document.getElementById('playPause'),p=document.getElementById('progress'),o=document.getElementById('timeLabel'),d=10000;let playing=true,r;const a=()=>document.getAnimations();function set(t){a().forEach(x=>{x.currentTime=t;x.pause()});p.value=t/1000;o.value=`${(t/1000).toFixed(1)} / 10.0`}function sync(){const t=Math.min(Number(a()[0]?.currentTime||0),d);p.value=t/1000;o.value=`${(t/1000).toFixed(1)} / 10.0`;if(playing&&t>=d){playing=false;b.textContent='↻';return}r=requestAnimationFrame(sync)}function play(t){a().forEach(x=>{x.currentTime=t;x.play()});playing=true;b.textContent='Ⅱ';cancelAnimationFrame(r);r=requestAnimationFrame(sync)}b.onclick=()=>{const t=Number(a()[0]?.currentTime||0);if(t>=d)return play(0);if(playing){a().forEach(x=>x.pause());playing=false;b.textContent='▶';cancelAnimationFrame(r)}else play(t)};p.oninput=()=>{set(Number(p.value)*1000);playing=false;b.textContent='▶';cancelAnimationFrame(r)};requestAnimationFrame(()=>play(0));</script></body>
