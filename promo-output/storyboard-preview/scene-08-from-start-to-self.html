<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LumosTime - 从开始，到看见自己</title><style>
:root{--p:#faf9f6;--i:#1c1917;--b:#57534e;--v:#8b6fa8;--g:#7a9176;--bl:#6b8ca8;--o:#c89b7a}*{box-sizing:border-box}body{min-width:960px;min-height:540px;margin:0;overflow:hidden;background:#dedad2;color:var(--i);font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun','Microsoft YaHei',serif}.film{position:relative;width:100vw;height:100vh;min-width:960px;min-height:540px;overflow:hidden;isolation:isolate;background:linear-gradient(90deg,rgba(77,68,56,.028) 1px,transparent 1px),linear-gradient(rgba(77,68,56,.022) 1px,transparent 1px),var(--p);background-size:42px 42px}.film:after{position:absolute;inset:0;z-index:30;content:'';opacity:.16;pointer-events:none;background-image:radial-gradient(rgba(64,54,43,.18) .5px,transparent .6px);background-size:5px 5px;mix-blend-mode:multiply}.meta,.scene{position:absolute;top:5.7%;z-index:10;color:#a8a29e;font-family:Georgia,'Times New Roman',serif;font-size:clamp(9px,.82vw,14px);letter-spacing:.12em}.meta{left:6.25%}.scene{right:6.25%;letter-spacing:.08em}.axis{position:absolute;top:17%;bottom:17%;left:50%;width:1px;background:#dfd9d1;transform:scaleY(0);transform-origin:top}.mark{position:absolute;left:50%;display:grid;width:54px;height:54px;place-items:center;border:1px solid #dfd9d1;border-radius:50%;background:#fffdfa;color:#78716c;font-family:ui-sans-serif,system-ui,sans-serif;font-size:19px;box-shadow:0 6px 15px rgba(52,43,35,.07);opacity:0;transform:translateX(-50%) scale(.7)}.mark.one{top:23%;color:var(--v)}.mark.two{top:39%;color:var(--g)}.mark.three{top:55%;color:var(--bl)}.mark.four{top:71%;color:var(--o)}.brand{position:absolute;top:50%;left:50%;z-index:3;width:620px;max-width:74vw;text-align:center;transform:translate(-50%,-50%)}.brand h1{margin:0;color:var(--i);font-family:Georgia,'Times New Roman','Noto Serif SC',serif;font-size:clamp(54px,6.3vw,120px);font-weight:600;letter-spacing:.02em;opacity:0;transform:translateY(15px)}.brand p{margin:23px 0 0;color:#78716c;font-size:clamp(18px,1.6vw,29px);line-height:1.5;opacity:0;transform:translateY(10px)}.brand p b{color:var(--i);font-weight:600}.sub{position:absolute;bottom:14%;left:50%;color:#a8a29e;font-family:ui-sans-serif,system-ui,sans-serif;font-size:clamp(10px,.8vw,14px);letter-spacing:.12em;opacity:0;transform:translateX(-50%)}.control{position:fixed;right:20px;bottom:20px;left:20px;z-index:40;display:flex;align-items:center;gap:12px;width:min(520px,calc(100vw - 40px));margin:auto;padding:10px 12px;border:1px solid rgba(70,59,48,.12);border-radius:7px;background:rgba(253,251,247,.91);box-shadow:0 10px 32px rgba(50,42,34,.16);font-family:ui-sans-serif,system-ui,sans-serif}.play{display:grid;width:29px;height:29px;place-items:center;border:0;border-radius:50%;color:white;background:var(--i);font-size:12px}.control input{width:100%;accent-color:var(--i)}output{width:72px;color:#57534e;font-size:11px;text-align:right}.axis{animation:axis 8s both}.mark.one{animation:mark 8s .25s both}.mark.two{animation:mark 8s .55s both}.mark.three{animation:mark 8s .85s both}.mark.four{animation:mark 8s 1.15s both}.brand h1{animation:title 8s both}.brand p{animation:copy 8s both}.sub{animation:sub 8s both}@keyframes axis{0%,12%{transform:scaleY(0)}42%,100%{transform:scaleY(1)}}@keyframes mark{0%,24%{opacity:0;transform:translateX(-50%) scale(.7)}38%,100%{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes title{0%,43%{opacity:0;transform:translateY(15px)}60%,100%{opacity:1;transform:none}}@keyframes copy{0%,57%{opacity:0;transform:translateY(10px)}73%,100%{opacity:1;transform:none}}@keyframes sub{0%,70%{opacity:0}85%,100%{opacity:1}}@media(max-width:1100px){.brand{max-width:65vw}}
</style></head><body><main class="film" aria-label="LumosTime 横屏宣传片结束镜：从开始，到看见自己"><div class="meta">LUMOSTIME / PRODUCT FILM</div><div class="scene">SCENE 08 · CLOSE</div><i class="axis"></i><i class="mark one">●</i><i class="mark two">↗</i><i class="mark three">◔</i><i class="mark four">✦</i><section class="brand"><h1>LumosTime</h1><p>从开始，<b>到看见自己。</b></p></section><p class="sub">记录时间 · 看见自己</p><div class="control"><button class="play" id="playPause" type="button">Ⅱ</button><input id="progress" type="range" min="0" max="8" step="0.01" value="0"><output id="timeLabel">0.0 / 8.0</output></div></main><script>const b=document.getElementById('playPause'),p=document.getElementById('progress'),o=document.getElementById('timeLabel'),d=8e3;let playing=true,r;const a=()=>document.getAnimations();function set(t){a().forEach(x=>{x.currentTime=t;x.pause()});p.value=t/1e3;o.value=`${(t/1e3).toFixed(1)} / 8.0`}function sync(){const t=Math.min(Number(a()[0]?.currentTime||0),d);p.value=t/1e3;o.value=`${(t/1e3).toFixed(1)} / 8.0`;if(playing&&t>=d){playing=false;b.textContent='↻';return}r=requestAnimationFrame(sync)}function play(t){a().forEach(x=>{x.currentTime=t;x.play()});playing=true;b.textContent='Ⅱ';cancelAnimationFrame(r);r=requestAnimationFrame(sync)}b.onclick=()=>{const t=Number(a()[0]?.currentTime||0);if(t>=d)return play(0);if(playing){a().forEach(x=>x.pause());playing=false;b.textContent='▶';cancelAnimationFrame(r)}else play(t)};p.oninput=()=>{set(Number(p.value)*1e3);playing=false;b.textContent='▶';cancelAnimationFrame(r)};requestAnimationFrame(()=>play(0));</script></body></html>
