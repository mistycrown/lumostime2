<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumosTime Product Film</title>
    <style>
      :root { --paper: #faf9f6; --ink: #1c1917; --muted: #78716c; --line: rgba(28, 25, 23, .16); }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
      body { font-family: Georgia, 'Times New Roman', 'Microsoft YaHei', serif; }
      .film { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--paper); }
      .scene-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; pointer-events: none; transition: opacity .7s ease; background: var(--paper); }
      .scene-frame.active { opacity: 1; }
      .controls { position: absolute; right: 24px; bottom: 22px; left: 24px; z-index: 30; display: flex; align-items: center; gap: 12px; width: min(680px, calc(100vw - 48px)); margin: auto; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: rgba(253, 251, 247, .92); box-shadow: 0 10px 32px rgba(50, 42, 34, .14); backdrop-filter: blur(12px); font-family: ui-sans-serif, system-ui, sans-serif; }
      button { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 50%; color: #fff; background: var(--ink); cursor: pointer; font-size: 13px; }
      button:focus-visible { outline: 2px solid #8b6fa8; outline-offset: 2px; }
      input { width: 100%; accent-color: var(--ink); cursor: pointer; }
      output { width: 116px; color: #57534e; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; white-space: nowrap; }
      @media (max-width: 720px) { .controls { right: 14px; bottom: 14px; left: 14px; width: calc(100vw - 28px); } output { width: 94px; } }
    </style>
  </head>
  <body>
    <main class="film" aria-label="LumosTime product film">
      <iframe class="scene-frame active" title="Scene 01" src="scene-01-source.html"></iframe>
      <iframe class="scene-frame" title="Scene 02" data-src="scene-02-time-becomes-a-thread.html"></iframe>
      <iframe class="scene-frame" title="Scene 03" data-src="scene-03-connected-purpose.html"></iframe>
      <iframe class="scene-frame" title="Scene 04" data-src="scene-04-see-your-time.html"></iframe>
      <iframe class="scene-frame" title="Scene 05" data-src="scene-05-say-it-naturally.html"></iframe>
      <iframe class="scene-frame" title="Scene 06" data-src="scene-07-project-through-time.html"></iframe>
      <iframe class="scene-frame" title="Scene 07" data-src="scene-06-touch-to-begin.html"></iframe>
      <iframe class="scene-frame" title="Scene 08" data-src="scene-08-from-start-to-self.html"></iframe>
      <div class="controls" aria-label="Product film playback controls">
        <button id="playPause" type="button" aria-label="Pause film">Ⅱ</button>
        <input id="progress" type="range" min="0" max="78" step="0.01" value="0" aria-label="Film progress" />
        <output id="timeLabel">0:00 / 1:18</output>
      </div>
    </main>
    <script>
      (() => {
        const frames = [...document.querySelectorAll('.scene-frame')];
        const durations = [10, 10, 10, 10, 10, 10, 10, 8];
        const offsets = durations.reduce((acc, duration, index) => { acc.push((acc[index - 1] || 0) + duration); return acc; }, []);
        const total = offsets[offsets.length - 1];
        const playPause = document.getElementById('playPause');
        const progress = document.getElementById('progress');
        const timeLabel = document.getElementById('timeLabel');
        let sceneIndex = 0;
        let elapsed = 0;
        let playing = true;
        let last = performance.now();

        const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
        const updateUi = () => {
          progress.value = String(elapsed);
          timeLabel.value = `${formatTime(elapsed)} / ${formatTime(total)}`;
          playPause.textContent = playing ? 'Ⅱ' : '▶';
          playPause.setAttribute('aria-label', playing ? 'Pause film' : 'Play film');
        };
        const pauseFrame = (frame) => {
          try {
            frame.contentWindow.document.querySelectorAll('.control, .control-bar').forEach((element) => { element.style.display = 'none'; });
            frame.contentWindow.document.querySelectorAll('button, input, output').forEach((element) => { element.tabIndex = -1; });
          } catch (_) { /* Browser file-origin policies may prevent styling the child; the wrapper still masks interaction. */ }
        };
        const showScene = (index, localTime = 0) => {
          const nextIndex = Math.max(0, Math.min(frames.length - 1, index));
          const changed = nextIndex !== sceneIndex;
          sceneIndex = nextIndex;
          frames.forEach((frame, i) => frame.classList.toggle('active', i === sceneIndex));
          const frame = frames[sceneIndex];
          if (!frame.getAttribute('src') && frame.dataset.src) frame.setAttribute('src', frame.dataset.src);
          else if (changed && frame.dataset.src) frame.setAttribute('src', frame.dataset.src);
          try { if (typeof frame.contentWindow.renderSceneAt === 'function') frame.contentWindow.renderSceneAt(localTime * 1000); } catch (_) { /* Wait for iframe load. */ }
          updateUi();
        };
        const setPosition = (position) => {
          elapsed = Math.max(0, Math.min(total, position));
          const index = offsets.findIndex((end) => elapsed < end) === -1 ? frames.length - 1 : offsets.findIndex((end) => elapsed < end);
          const start = index === 0 ? 0 : offsets[index - 1];
          showScene(index, elapsed - start);
        };
        frames.forEach((frame) => frame.addEventListener('load', () => pauseFrame(frame)));
        const tick = (now) => {
          if (playing) {
            elapsed += (now - last) / 1000;
            if (elapsed >= total) { elapsed = total; playing = false; }
            const index = offsets.findIndex((end) => elapsed < end) === -1 ? frames.length - 1 : offsets.findIndex((end) => elapsed < end);
            if (index !== sceneIndex) showScene(index, elapsed - (index === 0 ? 0 : offsets[index - 1]));
            updateUi();
          }
          last = now;
          requestAnimationFrame(tick);
        };
        playPause.addEventListener('click', () => { if (elapsed >= total) elapsed = 0; playing = !playing; last = performance.now(); updateUi(); });
        progress.addEventListener('input', () => { playing = false; setPosition(Number(progress.value)); });
        window.addEventListener('keydown', (event) => { if (event.key === ' ') { event.preventDefault(); playPause.click(); } if (event.key === 'ArrowRight') setPosition(Math.min(total, elapsed + durations[sceneIndex])); if (event.key === 'ArrowLeft') setPosition(Math.max(0, elapsed - durations[sceneIndex])); });
        showScene(0, 0);
        updateUi();
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
