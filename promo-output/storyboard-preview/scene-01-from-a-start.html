<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumosTime - 从一次开始</title>
    <style>
      :root {
        --paper: #fdfbf7;
        --paper-deep: #f3efe7;
        --ink: #292524;
        --muted: #78716c;
        --line: #d6d3d1;
        --plum: #8b6fa8;
        --moss: #7a9176;
        --rust: #c68c6b;
        --sky: #6b8ca8;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background: #e7e1d7;
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
      }

      button, input { font: inherit; }

      .stage {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(72, 61, 51, .035) 1px, transparent 1px),
          linear-gradient(rgba(72, 61, 51, .03) 1px, transparent 1px),
          var(--paper);
        background-size: 38px 38px;
      }

      .stage::before {
        position: absolute;
        inset: 0;
        content: '';
        opacity: .32;
        pointer-events: none;
        background-image: radial-gradient(rgba(68, 56, 46, .18) .55px, transparent .55px);
        background-size: 6px 6px;
        mix-blend-mode: multiply;
      }

      .film {
        position: relative;
        width: min(100vw, 56.25vh);
        height: min(177.78vw, 100vh);
        min-width: 320px;
        min-height: 568px;
        overflow: hidden;
        isolation: isolate;
        background: var(--paper);
        box-shadow: 0 28px 70px rgba(50, 39, 27, .2);
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 15;
        opacity: .18;
        pointer-events: none;
        background-image: radial-gradient(rgba(58, 48, 38, .2) .55px, transparent .7px);
        background-size: 5px 5px;
        mix-blend-mode: multiply;
      }

      .eyebrow, .scene-label, .caption, .brand {
        position: absolute;
        z-index: 5;
        letter-spacing: 0;
      }

      .eyebrow {
        top: 6.1%;
        left: 8.2%;
        color: #a8a29e;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(8px, 1.8vw, 12px);
        letter-spacing: .13em;
      }

      .scene-label {
        top: 6.1%;
        right: 8.2%;
        color: #a8a29e;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(8px, 1.8vw, 12px);
        letter-spacing: .08em;
      }

      .headline {
        position: absolute;
        top: 16.3%;
        left: 8.2%;
        z-index: 4;
        width: 82%;
        margin: 0;
        color: var(--ink);
        font-size: clamp(32px, 8.2vw, 60px);
        font-weight: 600;
        line-height: 1.2;
      }

      .headline span { display: block; }
      .headline .faint { color: #a8a29e; }

      .headline, .headline span, .phone, .timeline, .caption, .brand, .thread, .time-dot {
        animation-play-state: var(--play-state, running);
      }

      .headline .first { animation: headline-first 10s both; }
      .headline .second { animation: headline-second 10s both; }

      .thread {
        position: absolute;
        top: 40.2%;
        left: 12.5%;
        z-index: 1;
        width: 2px;
        height: 0;
        background: var(--ink);
        transform-origin: top;
        animation: thread-draw 10s both;
      }

      .time-dot {
        position: absolute;
        top: 39.5%;
        left: calc(12.5% - 4px);
        z-index: 2;
        width: 10px;
        height: 10px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--paper);
        animation: initial-dot 10s both;
      }

      .phone {
        position: absolute;
        top: 28.3%;
        left: 50%;
        z-index: 3;
        width: 61%;
        aspect-ratio: 9 / 18.8;
        overflow: hidden;
        border: 5px solid #312e2c;
        border-radius: 30px;
        background: #faf9f6;
        box-shadow: 0 18px 34px rgba(48, 40, 33, .22), 0 2px 0 #80766d inset;
        transform: translateX(-50%) translateY(55%) scale(.82);
        opacity: 0;
        animation: phone-arrive 10s both;
      }

      .phone::before {
        position: absolute;
        top: 8px;
        left: 50%;
        z-index: 3;
        width: 35%;
        height: 16px;
        border-radius: 999px;
        content: '';
        background: #312e2c;
        transform: translateX(-50%);
      }

      .statusbar {
        display: flex;
        justify-content: space-between;
        padding: 10px 14px 4px;
        color: #57534e;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 7px;
        font-weight: 700;
      }

      .app {
        display: grid;
        grid-template-columns: 30% 1fr;
        height: calc(100% - 23px);
        padding-bottom: 7px;
      }

      .rail {
        padding: 18px 6px 4px 10px;
        border-right: 1px solid #ece7df;
      }

      .rail p {
        margin: 0 0 13px;
        color: #57534e;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 7px;
        font-weight: 700;
      }

      .category {
        display: grid;
        width: 100%;
        min-height: 38px;
        place-items: center;
        margin-bottom: 7px;
        border: 0;
        border-radius: 11px;
        color: #a8a29e;
        background: transparent;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 6px;
      }

      .category.selected {
        color: #292524;
        background: #fff;
        box-shadow: 1px 2px 7px rgba(71, 55, 40, .08);
      }

      .activity-panel { padding: 18px 10px 7px; }

      .app-title {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 18px;
        font-size: 11px;
      }

      .app-title::after {
        width: 100%;
        height: 1px;
        content: '';
        background: #e7e5e4;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .tile {
        position: relative;
        display: grid;
        min-height: 72px;
        place-items: center;
        border: 0;
        border-radius: 16px;
        color: #57534e;
        background: #fff;
        box-shadow: 0 2px 8px rgba(74, 60, 44, .06);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 8px;
      }

      .tile .emoji { display: block; margin-bottom: 5px; font-size: 22px; }
      .tile.target { animation: target-tap 10s both; }
      .tile.target::after {
        position: absolute;
        inset: -6px;
        border: 1px solid var(--plum);
        border-radius: 20px;
        content: '';
        opacity: 0;
        animation: tap-ring 10s both;
      }

      .floating-timer {
        position: absolute;
        right: 8px;
        bottom: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 35px;
        height: 35px;
        border: 3px solid #fff;
        border-radius: 50%;
        color: #fff;
        background: var(--plum);
        box-shadow: 0 4px 10px rgba(90, 72, 108, .35);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 6px;
        font-weight: 700;
        opacity: 0;
        animation: timer-enter 10s both;
      }

      .timeline {
        position: absolute;
        right: 8.2%;
        bottom: 14.7%;
        left: 8.2%;
        z-index: 4;
        height: 14.6%;
        border-top: 1px solid #cfc8bd;
        opacity: 0;
        animation: timeline-enter 10s both;
      }

      .timeline-label {
        position: absolute;
        top: -23px;
        left: 0;
        color: #78716c;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(9px, 1.8vw, 12px);
      }

      .record-block {
        position: absolute;
        top: 14px;
        left: 20%;
        width: 0;
        height: 39%;
        overflow: hidden;
        border-left: 3px solid var(--plum);
        border-radius: 4px;
        background: rgba(139, 111, 168, .2);
        animation: record-grow 10s both;
      }

      .record-block span {
        position: absolute;
        top: 5px;
        left: 8px;
        color: #554362;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(8px, 1.7vw, 11px);
        font-weight: 700;
        white-space: nowrap;
      }

      .record-mark {
        position: absolute;
        top: -5px;
        left: 20%;
        width: 10px;
        height: 10px;
        border: 2px solid var(--plum);
        border-radius: 50%;
        background: var(--paper);
        animation: record-mark 10s both;
      }

      .caption {
        right: 8.2%;
        bottom: 7.1%;
        left: 8.2%;
        color: #57534e;
        font-size: clamp(17px, 4.15vw, 28px);
        line-height: 1.35;
        opacity: 0;
        animation: caption-enter 10s both;
      }

      .caption strong { color: var(--ink); font-weight: 600; }

      .brand {
        right: 8.2%;
        bottom: 5.7%;
        left: 8.2%;
        color: #292524;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(23px, 5.2vw, 37px);
        font-weight: 700;
        opacity: 0;
        animation: brand-enter 10s both;
      }

      .control-bar {
        position: fixed;
        right: 20px;
        bottom: 20px;
        left: 20px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(520px, calc(100vw - 40px));
        margin: auto;
        padding: 10px 12px;
        border: 1px solid rgba(70, 59, 48, .12);
        border-radius: 7px;
        background: rgba(253, 251, 247, .91);
        box-shadow: 0 10px 32px rgba(50, 42, 34, .16);
        backdrop-filter: blur(12px);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      .control-button {
        display: grid;
        width: 29px;
        height: 29px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: var(--ink);
        cursor: pointer;
        font-size: 12px;
      }

      .control-button:hover { background: #44403c; }
      .control-bar input { width: 100%; accent-color: var(--ink); }
      .control-time { width: 72px; color: #57534e; font-size: 11px; text-align: right; }

      .stage.playing .film * { animation-play-state: running; }
      .stage.paused .film * { animation-play-state: paused; }

      @keyframes headline-first {
        0%, 11% { opacity: 0; transform: translateY(18px); }
        18%, 37% { opacity: 1; transform: translateY(0); }
        44%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes headline-second {
        0%, 14% { opacity: 0; transform: translateY(18px); }
        21%, 37% { opacity: 1; transform: translateY(0); }
        44%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes initial-dot {
        0%, 27% { opacity: 0; transform: scale(.3); }
        31%, 100% { opacity: 1; transform: scale(1); }
      }
      @keyframes thread-draw {
        0%, 27% { height: 0; opacity: 0; }
        35%, 100% { height: 53%; opacity: 1; }
      }
      @keyframes phone-arrive {
        0%, 21% { opacity: 0; transform: translateX(-50%) translateY(55%) scale(.82); }
        34%, 61% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        67%, 100% { opacity: 0; transform: translateX(-50%) translateY(-12%) scale(.9); }
      }
      @keyframes target-tap {
        0%, 37% { transform: scale(1); }
        40% { transform: scale(.93); background: #f2ebf8; }
        43%, 100% { transform: scale(1); background: #fff; }
      }
      @keyframes tap-ring {
        0%, 37% { opacity: 0; transform: scale(.7); }
        41% { opacity: 1; transform: scale(1); }
        48%, 100% { opacity: 0; transform: scale(1.22); }
      }
      @keyframes timer-enter {
        0%, 42% { opacity: 0; transform: scale(.4); }
        48%, 61% { opacity: 1; transform: scale(1); }
        67%, 100% { opacity: 0; transform: scale(.75); }
      }
      @keyframes timeline-enter {
        0%, 59% { opacity: 0; transform: translateY(18px); }
        68%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes record-grow {
        0%, 68% { width: 0; }
        85%, 100% { width: 56%; }
      }
      @keyframes record-mark {
        0%, 67% { opacity: 0; transform: scale(.2); }
        72%, 100% { opacity: 1; transform: scale(1); }
      }
      @keyframes caption-enter {
        0%, 73% { opacity: 0; transform: translateY(12px); }
        82%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes brand-enter {
        0%, 89% { opacity: 0; transform: translateY(10px); }
        96%, 100% { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 560px) {
        .film { width: 100vw; height: 100vh; min-width: 0; min-height: 0; box-shadow: none; }
        .control-bar { right: 12px; bottom: 12px; left: 12px; width: auto; }
      }
    </style>
  </head>
  <body>
    <main class="stage playing" id="stage">
      <section class="film" aria-label="LumosTime 宣传片分镜试片：从一次开始">
        <div class="grain"></div>
        <div class="eyebrow">LUMOSTIME / PRODUCT FILM</div>
        <div class="scene-label">SCENE 01 · CONCEPT</div>

        <h1 class="headline" aria-label="时间不会自动成为积累">
          <span class="first">时间不会自动</span>
          <span class="second faint">成为积累。</span>
        </h1>

        <div class="thread"></div>
        <div class="time-dot"></div>

        <article class="phone" aria-label="构建式 LumosTime 计时界面预览">
          <div class="statusbar"><span>09:41</span><span>●●● 5G ▰</span></div>
          <div class="app">
            <aside class="rail">
              <p>分类</p>
              <button class="category selected" type="button">学习</button>
              <button class="category" type="button">生活</button>
              <button class="category" type="button">工作</button>
            </aside>
            <section class="activity-panel">
              <h2 class="app-title">选择活动</h2>
              <div class="tiles">
                <button class="tile target" type="button"><span><b class="emoji">◌</b>看网课</span></button>
                <button class="tile" type="button"><span><b class="emoji">✎</b>写作业</span></button>
                <button class="tile" type="button"><span><b class="emoji">⌁</b>阅读</span></button>
                <button class="tile" type="button"><span><b class="emoji">◫</b>复盘</span></button>
              </div>
            </section>
          </div>
          <div class="floating-timer">00:01</div>
        </article>

        <section class="timeline" aria-label="记录进入时间轴">
          <div class="timeline-label">今天 · 脉络</div>
          <div class="record-mark"></div>
          <div class="record-block"><span>09:41　看网课</span></div>
        </section>

        <p class="caption">一段投入，<strong>从这里留下。</strong></p>
        <div class="brand">LumosTime</div>
      </section>

      <div class="control-bar" aria-label="试片播放控制">
        <button class="control-button" id="playPause" type="button" aria-label="暂停试片">Ⅱ</button>
        <input id="progress" type="range" min="0" max="10" step="0.01" value="0" aria-label="试片进度" />
        <output class="control-time" id="timeLabel" for="progress">0.0 / 10.0</output>
      </div>
    </main>
    <script>
      const stage = document.getElementById('stage');
      const button = document.getElementById('playPause');
      const progress = document.getElementById('progress');
      const timeLabel = document.getElementById('timeLabel');
      const animations = [...document.querySelectorAll('.film *')]
        .flatMap((element) => element.getAnimations({ subtree: false }));
      const duration = 10000;
      let isPlaying = true;
      let rafId;

      function setTime(milliseconds) {
        animations.forEach((animation) => {
          animation.currentTime = milliseconds;
          animation.pause();
        });
        progress.value = String(milliseconds / 1000);
        timeLabel.value = `${(milliseconds / 1000).toFixed(1)} / 10.0`;
      }

      function syncProgress() {
        const currentTime = Math.min(Number(animations[0]?.currentTime || 0), duration);
        progress.value = String(currentTime / 1000);
        timeLabel.value = `${(currentTime / 1000).toFixed(1)} / 10.0`;
        if (isPlaying && currentTime >= duration) {
          isPlaying = false;
          stage.classList.remove('playing');
          stage.classList.add('paused');
          button.textContent = '↺';
          button.setAttribute('aria-label', '重新播放试片');
          return;
        }
        rafId = requestAnimationFrame(syncProgress);
      }

      function playFrom(milliseconds) {
        animations.forEach((animation) => {
          animation.currentTime = milliseconds;
          animation.play();
        });
        isPlaying = true;
        stage.classList.remove('paused');
        stage.classList.add('playing');
        button.textContent = 'Ⅱ';
        button.setAttribute('aria-label', '暂停试片');
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(syncProgress);
      }

      button.addEventListener('click', () => {
        const currentTime = Number(animations[0]?.currentTime || 0);
        if (currentTime >= duration) {
          playFrom(0);
          return;
        }
        if (isPlaying) {
          animations.forEach((animation) => animation.pause());
          isPlaying = false;
          stage.classList.remove('playing');
          stage.classList.add('paused');
          button.textContent = '▶';
          button.setAttribute('aria-label', '播放试片');
          cancelAnimationFrame(rafId);
          return;
        }
        playFrom(currentTime);
      });

      progress.addEventListener('input', () => {
        setTime(Number(progress.value) * 1000);
        isPlaying = false;
        stage.classList.remove('playing');
        stage.classList.add('paused');
        button.textContent = '▶';
        button.setAttribute('aria-label', '播放试片');
        cancelAnimationFrame(rafId);
      });

      requestAnimationFrame(() => playFrom(0));
    </script>
  </body>
</html>
