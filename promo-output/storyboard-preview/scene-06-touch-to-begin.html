:root{--paper:#faf9f6;--ink:#1c1917;--body:#57534e;--line:#e7e5e4;--purple:#8b6fa8;--green:#7a9176;--orange:#c89b7a}*{box-sizing:border-box}body{min-width:960px;min-height:540px;margin:0;overflow:hidden;background:#dedad2;color:var(--ink);font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun','Microsoft YaHei',serif}.film{position:relative;width:100vw;height:100vh;min-width:960px;min-height:540px;overflow:hidden;isolation:isolate;background:linear-gradient(90deg,rgba(77,68,56,.028) 1px,transparent 1px),linear-gradient(rgba(77,68,56,.022) 1px,transparent 1px),var(--paper);background-size:42px 42px}.film:after{position:absolute;inset:0;z-index:30;content:'';opacity:.16;pointer-events:none;background-image:radial-gradient(rgba(64,54,43,.18) .5px,transparent .6px);background-size:5px 5px;mix-blend-mode:multiply}.meta,.scene{position:absolute;top:5.7%;z-index:10;color:#a8a29e;font-family:Georgia,'Times New Roman',serif;font-size:clamp(9px,.82vw,14px);letter-spacing:.12em}.meta{left:6.25%}.scene{right:6.25%;letter-spacing:.08em}.copy{position:absolute;top:28%;left:6.25%;z-index:6;width:28.5%}.copy h1{margin:0;font-size:clamp(36px,4vw,76px);font-weight:600;line-height:1.18}.copy h1 span{display:block}.copy .muted{color:#a8a29e}.rule{width:0;height:1px;margin-top:29px;background:#a8a29e}.copy p{margin:26px 0 0;color:var(--body);font-size:clamp(14px,1.2vw,21px);line-height:1.75;opacity:0;transform:translateY(12px)}
.stage{position:absolute;top:13%;right:6.25%;bottom:11.5%;width:59%;min-width:630px;overflow:hidden;border:1px solid rgba(87,83,78,.13);border-radius:8px;background:#f4f1ec;box-shadow:0 26px 55px rgba(64,53,42,.16),0 2px 8px rgba(64,53,42,.08);opacity:0;transform:translateX(9%) scale(.97)}.deskline{position:absolute;right:0;bottom:0;left:0;height:26%;background:#e7e1d8}.stage-label{position:absolute;top:29px;left:34px;color:#a8a29e;font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;letter-spacing:.12em}.nfc-tag{position:absolute;top:38%;left:20%;display:grid;width:128px;height:128px;place-items:center;border:1px solid #cfc6b8;border-radius:12px;background:#f8f6f1;box-shadow:0 10px 21px rgba(68,57,44,.13);color:#686158;font-family:ui-sans-serif,system-ui,sans-serif;opacity:0;transform:translateY(18px) rotate(-4deg)}.nfc-rings{position:absolute;width:43px;height:43px;border:2px solid #8b8479;border-radius:50%}.nfc-rings:before,.nfc-rings:after{position:absolute;inset:-9px;border:2px solid #8b8479;border-radius:50%;content:''}.nfc-rings:after{inset:-19px}.tagtext{position:absolute;bottom:19px;font-size:10px;font-weight:700;letter-spacing:.13em}.phone{position:absolute;right:17%;bottom:11%;width:235px;height:410px;padding:9px;border:6px solid #292524;border-radius:31px;background:#292524;box-shadow:0 21px 38px rgba(43,35,29,.27);opacity:0;transform:translateY(24px) rotate(4deg)}.phone:before{position:absolute;top:10px;left:50%;z-index:3;width:72px;height:17px;border-radius:999px;background:#292524;content:'';transform:translateX(-50%)}.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:20px;background:#faf9f6}.mobile-head{height:70px;padding:35px 15px 0;color:#292524;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px}.mobile-head b{font-size:16px}.catrail{position:absolute;top:70px;bottom:0;left:0;width:47px;padding-top:17px;background:#f0ece5}.cat{display:grid;width:31px;height:31px;place-items:center;margin:0 auto 12px;border-radius:50%;color:#a8a29e;font-size:12px}.cat.active{background:#fff;color:var(--purple);box-shadow:0 2px 7px rgba(0,0,0,.06)}.activities{padding:19px 12px 80px 61px}.activities h3{margin:0 0 18px;color:#57534e;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px}.activity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.activity{display:flex;flex-direction:column;align-items:center;gap:6px;color:#78716c;font-family:ui-sans-serif,system-ui,sans-serif;font-size:8px}.aicon{display:grid;width:38px;height:38px;place-items:center;border-radius:50%;background:#eee6f3;color:var(--purple);font-size:16px}.timer{position:absolute;right:9px;bottom:12px;left:55px;display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid #e7e2da;border-radius:999px;background:#fff;box-shadow:0 5px 13px rgba(65,53,42,.12);font-family:ui-sans-serif,system-ui,sans-serif;opacity:0;transform:translateY(12px)}.timer .aicon{width:25px;height:25px;font-size:11px}.timer b{color:#44403c;font-size:9px}.timer span{color:var(--purple);font-family:ui-monospace,'Cascadia Mono',monospace;font-size:9px}.check{display:grid;width:20px;height:20px;place-items:center;margin-left:auto;border-radius:50%;background:var(--purple);color:white;font-size:12px}.waves{position:absolute;top:39%;left:30%;width:220px;height:220px;pointer-events:none}.wave{position:absolute;top:50%;left:50%;width:30px;height:30px;border:1px solid rgba(139,111,168,.5);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0}.note{position:absolute;right:32px;bottom:28px;color:#78716c;font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;opacity:0}.final{position:absolute;bottom:13.4%;left:6.25%;z-index:7;max-width:360px;margin:0;color:var(--body);font-size:clamp(14px,1.2vw,21px);line-height:1.6;opacity:0;transform:translateY(10px)}.final strong{color:var(--ink);font-weight:600}.control{position:fixed;right:20px;bottom:20px;left:20px;z-index:40;display:flex;align-items:center;gap:12px;width:min(520px,calc(100vw - 40px));margin:auto;padding:10px 12px;border:1px solid rgba(70,59,48,.12);border-radius:7px;background:rgba(253,251,247,.91);box-shadow:0 10px 32px rgba(50,42,34,.16);font-family:ui-sans-serif,system-ui,sans-serif}.play{display:grid;width:29px;height:29px;place-items:center;border:0;border-radius:50%;color:white;background:var(--ink);font-size:12px}.control input{width:100%;accent-color:var(--ink)}output{width:72px;color:#57534e;font-size:11px;text-align:right}
.copy h1 span:first-child{animation:up 10s .1s both}.copy h1 span:last-child{animation:up 10s .6s both}.rule{animation:rule 10s both}.copy p{animation:body 10s both}.stage{animation:app 10s both}.nfc-tag{animation:tag 10s both}.phone{animation:phone 10s both}.timer{animation:timer 10s both}.wave.one{animation:wave 10s both}.wave.two{animation:wave 10s .25s both}.wave.three{animation:wave 10s .5s both}.note{animation:note 10s both}.final{animation:final 10s both}@keyframes up{0%,8%{opacity:0;transform:translateY(16px)}17%,100%{opacity:1;transform:none}}@keyframes rule{0%,25%{width:0;opacity:0}34%,100%{width:78px;opacity:1}}@keyframes body{0%,28%{opacity:0;transform:translateY(12px)}37%,100%{opacity:1;transform:none}}@keyframes app{0%,22%{opacity:0;transform:translateX(9%) scale(.97)}38%,100%{opacity:1;transform:none}}@keyframes tag{0%,45%{opacity:0;transform:translateY(18px) rotate(-4deg)}58%,100%{opacity:1;transform:translateY(0) rotate(-4deg)}}@keyframes phone{0%,51%{opacity:0;transform:translateY(24px) rotate(4deg)}64%,100%{opacity:1;transform:translateY(0) rotate(4deg)}}@keyframes wave{0%,64%{opacity:0;transform:translate(-50%,-50%) scale(.2)}67%{opacity:.8}84%,100%{opacity:0;transform:translate(-50%,-50%) scale(6)}}@keyframes timer{0%,76%{opacity:0;transform:translateY(12px)}87%,100%{opacity:1;transform:none}}@keyframes note{0%,79%{opacity:0}89%,100%{opacity:1}}@keyframes final{0%,84%{opacity:0;transform:translateY(10px)}93%,100%{opacity:1;transform:none}}@media(max-width:1100px){.stage{right:4.5%;width:61%}.copy{left:4.5%;width:27%}.meta{left:4.5%}.scene{right:4.5%}.final{left:4.5%}.phone{right:12%}.nfc-tag{left:12%}}

<body><main class="film" aria-label="LumosTime 横屏宣传片分镜：一触，即刻开始"><div class="meta">LUMOSTIME / PRODUCT FILM</div><div class="scene">SCENE 06 · TOUCH TO BEGIN</div><section class="copy"><h1><span>一触，</span><span class="muted">即刻开始。</span></h1><div class="rule"></div><p>把常做的事放到书桌、床头或日记本上。<br>开始记录，<strong>不必先打开应用。</strong></p></section><section class="stage" aria-label="以当前 NFCSettingsView 设置和 RecordView 计时界面为依据重建的 Android NFC 一触即记场景"><span class="stage-label">ANDROID · NFC TAG</span><div class="deskline"></div><div class="nfc-tag"><i class="nfc-rings"></i><b class="tagtext">ENGLISH STUDY</b></div><div class="waves"><i class="wave one"></i><i class="wave two"></i><i class="wave three"></i></div><div class="phone"><div class="screen"><header class="mobile-head"><b>计时</b></header><aside class="catrail"><i class="cat active">学</i><i class="cat">工</i><i class="cat">生</i></aside><section class="activities"><h3>学习</h3><div class="activity-grid"><div class="activity"><i class="aicon">Aa</i>英语</div><div class="activity"><i class="aicon">⌘</i>写代码</div><div class="activity"><i class="aicon">▤</i>阅读</div></div></section><div class="timer"><i class="aicon">Aa</i><div><b>英语系统课</b><br><span>00:01</span></div><i class="check">✓</i></div></div></div><p class="note">扫描标签后自动开始「英语系统课」</p></section><p class="final">工具不该等你想起来。<strong>它应该在你准备开始的地方。</strong></p><div class="control"><button class="play" id="playPause" type="button">Ⅱ</button><input id="progress" type="range" min="0" max="10" step="0.01" value="0"><output id="timeLabel">0.0 / 10.0</output></div></main><script>const b=document.getElementById('playPause'),p=document.getElementById('progress'),o=document.getElementById('timeLabel'),d=1e4;let playing=true,r;const a=()=>document.getAnimations();function set(t){a().forEach(x=>{x.currentTime=t;x.pause()});p.value=t/1e3;o.value=`${(t/1e3).toFixed(1)} / 10.0`}function sync(){const t=Math.min(Number(a()[0]?.currentTime||0),d);p.value=t/1e3;o.value=`${(t/1e3).toFixed(1)} / 10.0`;if(playing&&t>=d){playing=false;b.textContent='↻';return}r=requestAnimationFrame(sync)}function play(t){a().forEach(x=>{x.currentTime=t;x.play()});playing=true;b.textContent='Ⅱ';cancelAnimationFrame(r);r=requestAnimationFrame(sync)}b.onclick=()=>{const t=Number(a()[0]?.currentTime||0);if(t>=d)return play(0);if(playing){a().forEach(x=>x.pause());playing=false;b.textContent='▶';cancelAnimationFrame(r)}else play(t)};p.oninput=()=>{set(Number(p.value)*1e3);playing=false;b.textContent='▶';cancelAnimationFrame(r)};requestAnimationFrame(()=>play(0));</script></body></html>
