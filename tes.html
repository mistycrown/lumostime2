<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义粗细和圆角的环形图</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f5f8;
            margin: 0;
        }
        canvas {
            /* 辅助查看 Canvas 区域，成品可去掉 */
            /* border: 1px solid #ddd; */
        }
    </style>
</head>
<body>

    <canvas id="customDonutCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('customDonutCanvas');
        const ctx = canvas.getContext('2d');

        // --- 配置区域 ---
        const data = [28, 15, 8, 12, 18, 10, 19];
        const colors = ['#e1d3d5', '#5a7689', '#eadbca', '#aed3e1', '#c7b2b5', '#f5f5f0', '#bdaaa8'];
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 【核心配置】：在这里随意修改厚度和圆角大小
        const outerRadius = 150;    // 外圈半径
        const thickness = 70;       // 【很粗的环】：环的厚度
        const cornerRadius = 10;     // 【一点点圆】：圆角的半径 (必须小于厚度的一半)
        const gap = 0.04;           // 区块间的间隙 (弧度)
        // ----------------

        const innerRadius = outerRadius - thickness;
        const total = data.reduce((sum, val) => sum + val, 0);
        let currentAngle = -Math.PI / 2; // 从正上方开始

        // 辅助函数：计算角度偏移量，防止圆角突出
        // 原理：利用三角函数计算小圆角占用的弧度角
        function getAngleOffset(R, cr) {
            // 如果圆角过大导致计算错误，返回一个安全值
            if (cr >= R) return 0;
            // 核心三角公式：sin(θ) = 对边/斜边
            return Math.asin(cr / (R - cr));
        }

        // 计算内圈和外圈需要的角度补偿量
        const angleOffsetOut = getAngleOffset(outerRadius, cornerRadius);
        const angleOffsetIn = getAngleOffset(innerRadius, cornerRadius);


        data.forEach((val, index) => {
            // 1. 计算当前区块占用的总角度
            const sliceAngle = (val / total) * (Math.PI * 2);
            
            // 2. 确定实际绘制的起止角度（减去间隙）
            const startA = currentAngle + gap / 2;
            const endA = currentAngle + sliceAngle - gap / 2;

            // 安全检查：如果角度太小不足以绘制圆角，则跳过或绘制极小块
            // 这里简单处理，确保 endA > startA
            if (endA <= startA + angleOffsetOut * 2) {
                 currentAngle += sliceAngle;
                 return;
            }
            
            ctx.beginPath();
            ctx.fillStyle = colors[index % colors.length];

            // --- 复杂的路径绘制开始 ---

            // 步骤 1: 绘制外圆弧
            // 起点和终点都要向内收缩一个偏移量(angleOffsetOut)，为圆角留位置
            ctx.arc(cx, cy, outerRadius, startA + angleOffsetOut, endA - angleOffsetOut, false);

            // 步骤 2: 绘制第一个圆角 (连接外圈终点 -> 内圈终点)
            // 我们需要知道“理论上的尖角”坐标在哪里，作为 arcTo 的控制点
            // 理论外侧尖角坐标
            const xOuterEnd = cx + outerRadius * Math.cos(endA);
            const yOuterEnd = cy + outerRadius * Math.sin(endA);
            // 理论内侧尖角坐标
            const xInnerEnd = cx + innerRadius * Math.cos(endA);
            const yInnerEnd = cy + innerRadius * Math.sin(endA);
            
            // 使用 arcTo 平滑过渡。当前点在外圆弧终点，向外侧尖角延伸，再向内侧尖角弯曲
            ctx.arcTo(xOuterEnd, yOuterEnd, xInnerEnd, yInnerEnd, cornerRadius);

            // 步骤 3: 绘制内圆弧 (注意是反向绘制，true 表示逆时针)
            // 同样需要角度补偿
            ctx.arc(cx, cy, innerRadius, endA - angleOffsetIn, startA + angleOffsetIn, true);

            // 步骤 4: 绘制第二个圆角 (连接内圈起点 -> 外圈起点)
            // 理论内侧起点尖角
            const xInnerStart = cx + innerRadius * Math.cos(startA);
            const yInnerStart = cy + innerRadius * Math.sin(startA);
            // 理论外侧起点尖角
            const xOuterStart = cx + outerRadius * Math.cos(startA);
            const yOuterStart = cy + outerRadius * Math.sin(startA);

            // 平滑过渡回外圈
            ctx.arcTo(xInnerStart, yInnerStart, xOuterStart, yOuterStart, cornerRadius);
            
            // 路径闭合
            ctx.closePath();
            // 填充颜色
            ctx.fill();

            // 更新下一块的起始角度
            currentAngle += sliceAngle;
        });

    </script>
</body>
</html>
