// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def androidBuildRootPath = hasProperty('lumostime.androidBuildDir')
    ? property('lumostime.androidBuildDir')
    : 'E:/tmp/lumostime-android-build'

// Keep Android build outputs out of the OneDrive-synced repo tree to reduce file-lock churn.
rootProject.layout.buildDirectory.set(file("${androidBuildRootPath}/root"))

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

subprojects { subproject ->
    def subprojectBuildFolder = subproject.projectDir.toString().contains("${File.separator}node_modules${File.separator}")
        ? "plugin-build/${subproject.name}"
        : "modules/${subproject.name}"

    subproject.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(subprojectBuildFolder))

    afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.application') || subproject.plugins.hasPlugin('com.android.library')) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }

        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
