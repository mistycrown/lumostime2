<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LumosTime</title>
  <link rel="icon" type="image/x-icon" href="./icon.ico">

  <script>
    (function() {
      try {
        const savedFont = localStorage.getItem('lumostime_font_family');
        const fontMap = {
          'default': '"Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN", "Songti SC", "STSong", "SimSun", "Microsoft YaHei", serif',
          'lxgw-wenkai': '"LXGW WenKai", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif',
          'lxgw-neo-zhisong': '"LXGW Neo ZhiSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif',
          'ding-lie-song': '"Ding Lie Song", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif',
          'zhuque-fangsong': '"Zhuque Fangsong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif',
          'wenquanyi-bitmap': '"WenQuanYi Bitmap Song", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif'
        };
        const fontFamily = fontMap[savedFont] || fontMap.default;
        document.documentElement.style.setProperty('--font-family', fontFamily);
        console.log('[Font Init] Applied font:', savedFont || 'default', '->', fontFamily);
      } catch (error) {
        console.error('[Font Init] Failed:', error);
        document.documentElement.style.setProperty('--font-family', '"Noto Serif SC", "Source Han Serif SC", "SimSun", "Microsoft YaHei", serif');
      }
    })();
  </script>

  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Source Han Serif CN', 'Songti SC', 'STSong', 'SimSun', 'Microsoft YaHei', serif;
    }

    body {
      font-family: var(--font-family);
      font-weight: 400;
    }

    .font-handwriting {
      font-family: 'Bilbo Swash Caps', 'Georgia', 'Times New Roman', cursive, serif !important;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a8a29e;
    }

    .mask-linear-fade {
      mask-image: linear-gradient(to right, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent;
      bottom: 0;
      color: transparent;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      width: auto;
      height: auto;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .bg-with-gradient::before,
    .bg-with-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      opacity: var(--bg-opacity, 0.8);
    }

    .bg-with-gradient::before {
      background: var(--bg-gradient);
    }

    .bg-with-image::before {
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fafaf9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e7e5e4;
      border-top-color: #1c1917;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 20px;
      color: #78716c;
      font-size: 14px;
    }
  </style>

  <script>
    setTimeout(function() {
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
          console.log('[Font] Fonts loaded successfully');
        });
      }
    }, 100);

    // Emergency fallback: if the app-ready event never fires, still remove the splash screen.
    setTimeout(function() {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        setTimeout(function() {
          loadingScreen.remove();
        }, 300);
      }
    }, 5000);
  </script>
</head>

<body>
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载本地数据...</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
